name: Tests

on:
  workflow_call:
    inputs:
      workdir:
        required: true
        type: string
      coverage-flag:
        required: true
        type: string

jobs:
  test:
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.workdir }}/go.mod
          cache-dependency-path: ${{ inputs.workdir }}/go.mod

      - name: Run tests
        working-directory: ${{ inputs.workdir }}
        run: |
          go mod tidy
          make test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ inputs.workdir }}/cover.out
          flags: ${{ inputs.coverage-flag }}
          fail_ci_if_error: false
